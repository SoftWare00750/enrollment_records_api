spring:
  application:
    name: school-enrolment-records-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/enrolment}
    username: ${DB_USER:enrolment}
    password: ${DB_PASSWORD:enrolment}
  jpa:
    open-in-view: false          # no lazy loading in controllers; services map to DTOs
    hibernate:
      ddl-auto: none             # Flyway owns the schema; Hibernate never alters it
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
